<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Expense Tracker v2: white euro on a blue full-bleed square (maskable-safe),
       plus a white "2" badge so the home-screen icon differs from v1 -->
  <rect width="32" height="32" fill="#0a4fa8"/>
  <text x="13.5" y="21.5" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff">€</text>
  <circle cx="23" cy="23" r="6" fill="#ffffff"/>
  <text x="23" y="26.4" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9.5" font-weight="800" fill="#0a4fa8">2</text>
</svg>
